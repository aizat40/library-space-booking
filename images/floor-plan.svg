<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Library floor plan availability map</title>
  <desc id="desc">A simplified floor plan for Tunku Tun Aminah Library showing discussion rooms, study zones, service desk, and status colors.</desc>
  <rect width="920" height="560" fill="#f6f8fb"/>
  <rect x="30" y="30" width="860" height="500" rx="8" fill="#ffffff" stroke="#c8d3dc" stroke-width="3"/>
  <rect x="60" y="70" width="230" height="170" rx="8" fill="#e8f7f0" stroke="#2f9e44" stroke-width="3"/>
  <text x="175" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18332c">Discussion Zone A</text>
  <text x="175" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#276749">6 rooms available</text>
  <rect x="315" y="70" width="210" height="170" rx="8" fill="#fff7d6" stroke="#f0b429" stroke-width="3"/>
  <text x="420" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#3b2f10">Learning Space B</text>
  <text x="420" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#8a5a00">2 rooms pending</text>
  <rect x="550" y="70" width="290" height="170" rx="8" fill="#fdecea" stroke="#d64545" stroke-width="3"/>
  <text x="695" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#4c1d1d">Media Room C</text>
  <text x="695" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#a61b1b">Conflict slot detected</text>
  <rect x="60" y="275" width="345" height="185" rx="8" fill="#eaf6fb" stroke="#1f9bb4" stroke-width="3"/>
  <text x="232" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0e4f5f">Quiet Study Area</text>
  <text x="232" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0e6678">Open seating</text>
  <rect x="435" y="275" width="220" height="185" rx="8" fill="#f2f4f7" stroke="#9aa8b4" stroke-width="3"/>
  <text x="545" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#27313a">Service Desk</text>
  <text x="545" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#53606b">Check-in point</text>
  <rect x="685" y="275" width="155" height="185" rx="8" fill="#e8f7f0" stroke="#2f9e44" stroke-width="3"/>
  <text x="762" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#18332c">Room D</text>
  <text x="762" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#276749">Available</text>
  <path d="M60 255H840" stroke="#c8d3dc" stroke-width="12" stroke-linecap="round"/>
  <path d="M420 255V458" stroke="#c8d3dc" stroke-width="12" stroke-linecap="round"/>
  <circle cx="96" cy="505" r="10" fill="#2f9e44"/>
  <text x="115" y="511" font-family="Arial, sans-serif" font-size="15" fill="#27313a">Available</text>
  <circle cx="235" cy="505" r="10" fill="#f0b429"/>
  <text x="254" y="511" font-family="Arial, sans-serif" font-size="15" fill="#27313a">Pending</text>
  <circle cx="360" cy="505" r="10" fill="#d64545"/>
  <text x="379" y="511" font-family="Arial, sans-serif" font-size="15" fill="#27313a">Conflict</text>
</svg>
