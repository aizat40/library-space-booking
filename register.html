<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Space Booking System | Register</title>
  <link rel="icon" type="image/png" href="images/UTHM.png" sizes="32x32">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="nav-shell" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="Library Space Booking System home">
        <img src="images/logo-uthm.png" alt="Logo UTHM" class="logo">
        <span>
          <strong>Library Booking</strong>
          <small>Tunku Tun Aminah Library</small>
        </span>
      </a>
      <div class="nav-links"></div>
      <div class="nav-actions"></div>
    </nav>
  </header>

  <main id="main">
    <section class="page-title">
      <div class="section">
        <p class="eyebrow">Create Account</p>
        <h1>Register</h1>
        <p>Create a student account using your UTHM identity before reserving library spaces.</p>
      </div>
    </section>

    <section class="section auth-shell">
      <article class="form-panel auth-panel">
        <h2>Student registration</h2>
        <form id="register-form" novalidate>
          <label for="full-name">Full name
            <input id="full-name" name="full-name" type="text" autocomplete="name" required>
          </label>
          <label for="matric">Matric number
            <input id="matric" name="matric" type="text" autocomplete="username" required>
          </label>
          <label for="email">UTHM email
            <input id="email" name="email" type="email" autocomplete="email" placeholder="name@uthm.edu.my" required>
          </label>
          <label for="new-password">Password
            <input id="new-password" name="new-password" type="password" autocomplete="new-password" required>
          </label>
          <label for="confirm-password">Confirm password
            <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required>
          </label>
          <button class="button" type="submit">Create Account</button>
        </form>

        <div class="auth-options single">
          <div>
            <p>Already have an account?</p>
            <a class="button secondary" href="login.html">Login Here</a>
          </div>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-shell">
      <span>&copy; 2026 Tunku Tun Aminah Library, UTHM.</span>
      <span>Library Space Booking System</span>
    </div>
  </footer>
  <script src="js/script.js" defer></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="js/aos-init.js" defer></script>
</body>
</html>
