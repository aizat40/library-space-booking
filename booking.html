<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Space Booking System | Booking Redirect</title>
  <link rel="icon" type="image/png" href="images/UTHM.png" sizes="32x32">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const parameters = new URLSearchParams(window.location.search);
      const query = parameters.toString();
      window.location.replace(`availability.html${query ? `?${query}` : ""}`);
    });
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="nav-shell" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="Library Space Booking System home">
        <img src="images/logo-uthm.png" alt="Logo UTHM" class="logo">
        <span>
          <strong>Library Booking</strong>
          <small>Tunku Tun Aminah Library</small>
        </span>
      </a>
      <div class="nav-links"></div>
      <div class="nav-actions"></div>
    </nav>
  </header>
  <main id="main">
    <section class="page-title">
      <div class="section">
        <p class="eyebrow">Booking</p>
        <h1>Opening room availability</h1>
        <p>Select a date and floor, open a room's details, then choose an available time slot.</p>
        <a class="button" href="availability.html">Continue to Availability</a>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-shell">
      <span>&copy; 2026 Tunku Tun Aminah Library, UTHM.</span>
      <span>Library Space Booking System</span>
    </div>
  </footer>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="js/aos-init.js" defer></script>
</body>
</html>
